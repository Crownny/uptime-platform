apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uptime-api
  template:
    metadata:
      labels:
        app: uptime-api
    spec:
      containers:
        - name: uptime-api
          image: uptime-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi